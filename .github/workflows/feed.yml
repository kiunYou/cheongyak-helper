# 30분마다 LH·SH 공고를 수집해 feed-data 브랜치의 notices.json으로 게시합니다.
# 바뀐 내용이 있을 때만 게시하고, 브랜치는 매번 새로 만들어 저장소가 커지지 않게 합니다.
name: feed

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 직전 결과 가져오기
        run: |
          mkdir -p out
          git fetch --depth=1 origin feed-data 2>/dev/null \
            && git show FETCH_HEAD:notices.json > out/notices.json || echo "이전 결과 없음(처음 실행)"

      - name: 단위 테스트
        run: python -I -m unittest discover -s feed-collector/tests

      - name: 공고 수집
        id: collect
        env:
          LH_API_KEY: ${{ secrets.LH_API_KEY }}
        run: python feed-collector/collect.py --out out/notices.json

      - name: feed-data 브랜치로 게시
        if: steps.collect.outputs.changed == 'true'
        run: |
          set -e
          pub="$(mktemp -d)"
          cp out/notices.json "$pub/notices.json"
          cd "$pub"
          git init -q -b feed-data
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add notices.json
          git commit -q -m "feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" feed-data
